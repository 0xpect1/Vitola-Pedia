<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — This Cigar Has Gone Out | Vitola Pedia</title>
  <meta name="description" content="The page you're looking for has gone out. Browse 25,815 premium cigars from 364 brands on Vitola Pedia." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#1a1209" />

  <!-- ═══ FONTS & STYLES ═══════════════════════════════════════════ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1209'/%3E%3Crect x='4' y='14' width='20' height='5' rx='2.5' fill='%23c9943a'/%3E%3Crect x='24' y='14' width='4' height='5' rx='1' fill='%23e8b86d'/%3E%3Ccircle cx='25' cy='13' r='2' fill='%23ff6b35' opacity='.9'/%3E%3C/svg%3E" />

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.06), transparent 60%),
        var(--bg-base);
    }
    .err404 {
      max-width: 640px;
      text-align: center;
    }
    .err404-number {
      font-family: var(--font-serif);
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 700;
      line-height: 1;
      color: var(--gold);
      letter-spacing: -0.03em;
      text-shadow: 0 0 40px rgba(201,168,76,0.18);
      margin-bottom: 0.2em;
    }
    .err404-ash {
      font-size: clamp(2.5rem, 7vw, 4rem);
      margin-bottom: 0.4em;
      opacity: 0.5;
    }
    .err404-title {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.6em;
    }
    .err404-sub {
      font-family: var(--font-body);
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 2rem;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }
    .err404-search {
      display: flex;
      gap: 0.5rem;
      max-width: 420px;
      margin: 0 auto 1.5rem;
    }
    .err404-search input {
      flex: 1;
      padding: 0.85rem 1.1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-h);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }
    .err404-search input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }
    .err404-search input::placeholder { color: var(--text-muted); }
    .err404-search button {
      padding: 0.85rem 1.4rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #1a1209;
      font-weight: 600;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      transition: var(--transition);
    }
    .err404-search button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .err404-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      margin-top: 1.5rem;
    }
    .err404-btn-home {
      display: inline-block;
      padding: 0.85rem 2rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #1a1209;
      font-weight: 600;
      border-radius: var(--radius-md);
      transition: var(--transition);
    }
    .err404-btn-home:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .err404-brands-link {
      color: var(--gold);
      font-family: var(--font-serif);
      font-style: italic;
      border-bottom: 1px solid var(--border-h);
      padding-bottom: 2px;
      transition: var(--transition);
    }
    .err404-brands-link:hover { color: var(--gold-light); border-color: var(--gold); }
    .err404-divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 2rem auto;
    }
  </style>
</head>
<body>
  <main class="err404">
    <div class="err404-ash">🚬</div>
    <div class="err404-number">404</div>
    <h1 class="err404-title">This Cigar Has Gone Out</h1>
    <p class="err404-sub">The page you're searching for has burned down to the nub. It may have been moved, relit under a different name, or simply gone up in smoke.</p>

    <div class="err404-divider"></div>

    <form class="err404-search" onsubmit="return searchCigars(event)">
      <input type="text" id="err404-query" placeholder="Search 25,815 cigars, brands, wrappers…" aria-label="Search cigars" />
      <button type="submit">Search</button>
    </form>

    <div class="err404-actions">
      <a href="/" class="err404-btn-home">← Back to Homepage</a>
      <a href="/#view=library" class="err404-brands-link">Browse Popular Brands</a>
    </div>
  </main>

  <script>
    function searchCigars(e) {
      e.preventDefault();
      var q = document.getElementById('err404-query').value.trim();
      var url = q ? '/#search=' + encodeURIComponent(q) : '/';
      window.location.href = url;
      return false;
    }
  </script>
</body>
</html>
