<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitola Pedia — 3D Cigar</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<script type="module">
const THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js');

// ═══ SCENE ═══════════════════════════════════════════════════════
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 0.3, 8.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ═══ ENVIRONMENT (for PBR reflections) ═══════════════════════════
function createEnvMap() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#0a0500'); g.addColorStop(0.2,'#1a0a02');
  g.addColorStop(0.4,'#3a1a08'); g.addColorStop(0.48,'#8a5c28');
  g.addColorStop(0.52,'#4a2a10'); g.addColorStop(0.7,'#1a0a02');
  g.addColorStop(1,'#000000');
  ctx.fillStyle = g; ctx.fillRect(0,0,512,256);
  for (let i=0;i<12;i++){
    const x=Math.random()*512, y=Math.random()*128, r=15+Math.random()*50;
    const rg=ctx.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,'rgba(255,220,150,0.5)'); rg.addColorStop(1,'rgba(255,220,150,0)');
    ctx.fillStyle=rg; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const envMap = createEnvMap();
scene.environment = envMap;

// ═══ LIGHTING — 6 point lights for studio quality ═══════════════
const keyLight = new THREE.DirectionalLight(0xfff0d0, 4);
keyLight.position.set(4, 5, 3);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x88aacc, 1.5);
fillLight.position.set(-4, -1, 2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xff9944, 2.5);
rimLight.position.set(-2, 3, -5);
scene.add(rimLight);

const topLight = new THREE.PointLight(0xfff0d0, 1.5, 10);
topLight.position.set(0, 4, 2);
scene.add(topLight);

const emberLight = new THREE.PointLight(0xff6b35, 5, 6, 1.0);
emberLight.position.set(-3, 0, 0);
scene.add(emberLight);

scene.add(new THREE.AmbientLight(0x1a0a02, 0.2));

// ═══ WRAPPER COLOR TEXTURE — ultra-detailed ═════════════════════
function createWrapperTexture() {
  const c = document.createElement('canvas');
  c.width = 4096; c.height = 1024;
  const ctx = c.getContext('2d');

  // Deep maduro base
  const grad = ctx.createLinearGradient(0,0,0,1024);
  grad.addColorStop(0,'#120800'); grad.addColorStop(0.05,'#1a0a02');
  grad.addColorStop(0.15,'#2a1505'); grad.addColorStop(0.3,'#3a1f0f');
  grad.addColorStop(0.4,'#4a2a14'); grad.addColorStop(0.5,'#5c3520');
  grad.addColorStop(0.6,'#4a2a14'); grad.addColorStop(0.7,'#3a1f0f');
  grad.addColorStop(0.85,'#2a1505'); grad.addColorStop(0.95,'#1a0a02');
  grad.addColorStop(1,'#120800');
  ctx.fillStyle = grad; ctx.fillRect(0,0,4096,1024);

  // Wrapper spiral seam — the line where the leaf overlaps
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= 4096; x += 2) {
    const y = 512 + Math.sin(x * 0.008) * 8 + Math.sin(x * 0.03) * 3;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  // Subtle highlight next to the seam
  ctx.strokeStyle = 'rgba(200,140,70,0.08)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (let x = 0; x <= 4096; x += 2) {
    const y = 514 + Math.sin(x * 0.008) * 8 + Math.sin(x * 0.03) * 3;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Major wrapper veins — thick, flowing
  for (let i = 0; i < 80; i++) {
    const x = Math.random() * 4096;
    const w = 1 + Math.random() * 4;
    const op = 0.03 + Math.random() * 0.12;
    ctx.strokeStyle = Math.random() > 0.3
      ? `rgba(0,0,0,${op})`
      : `rgba(190,130,65,${op*0.5})`;
    ctx.lineWidth = w;
    ctx.beginPath();
    let y = 0, cx = x;
    while (y < 1024) {
      const ny = y + 5 + Math.random() * 10;
      const ox = cx + (Math.random()-0.5)*18;
      ctx.moveTo(cx, y);
      ctx.quadraticCurveTo(ox, (y+ny)/2, cx+(Math.random()-0.5)*10, ny);
      cx += (Math.random()-0.5)*10; y = ny;
    }
    ctx.stroke();
  }

  // Fine veins
  for (let i = 0; i < 300; i++) {
    const x = Math.random()*4096;
    ctx.strokeStyle = `rgba(0,0,0,${0.01+Math.random()*0.05})`;
    ctx.lineWidth = 0.3 + Math.random();
    ctx.beginPath();
    let y=0, cx=x;
    while(y<1024){
      const ny=y+3+Math.random()*6;
      ctx.moveTo(cx,y); ctx.lineTo(cx+(Math.random()-0.5)*6, ny);
      cx+=(Math.random()-0.5)*6; y=ny;
    }
    ctx.stroke();
  }

  // Tooth grain — 30000 micro specks
  for (let i = 0; i < 30000; i++) {
    const x=Math.random()*4096, y=Math.random()*1024;
    const r=Math.random()*1.2;
    ctx.fillStyle = Math.random()>0.3
      ? `rgba(0,0,0,${0.008+Math.random()*0.06})`
      : `rgba(220,170,100,${0.004+Math.random()*0.03})`;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }

  // Oil sheen spots — glossy patches that catch light
  for (let i = 0; i < 500; i++) {
    const x=Math.random()*4096, y=Math.random()*1024;
    const r=4+Math.random()*15;
    const og=ctx.createRadialGradient(x,y,0,x,y,r);
    og.addColorStop(0,'rgba(255,200,120,0.1)');
    og.addColorStop(0.4,'rgba(255,180,90,0.04)');
    og.addColorStop(1,'rgba(255,200,120,0)');
    ctx.fillStyle=og;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }

  // Top highlight
  const sh = ctx.createLinearGradient(0,120,0,380);
  sh.addColorStop(0,'rgba(255,210,150,0)');
  sh.addColorStop(0.5,'rgba(255,210,150,0.04)');
  sh.addColorStop(1,'rgba(255,210,150,0)');
  ctx.fillStyle=sh; ctx.fillRect(0,120,4096,260);

  // Bottom shadow
  const bs = ctx.createLinearGradient(0,640,0,900);
  bs.addColorStop(0,'rgba(0,0,0,0)'); bs.addColorStop(1,'rgba(0,0,0,0.2)');
  ctx.fillStyle=bs; ctx.fillRect(0,640,4096,260);

  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 16; return t;
}

// ═══ NORMAL MAP — wrapper surface detail ═════════════════════════
function createNormalMap() {
  const c = document.createElement('canvas');
  c.width = 4096; c.height = 1024;
  const ctx = c.getContext('2d');
  // Base normal — pointing up
  ctx.fillStyle = '#8080ff'; ctx.fillRect(0,0,4096,1024);

  // Vein normals — offset direction
  for (let i = 0; i < 80; i++) {
    const x = Math.random()*4096;
    const w = 2 + Math.random()*6;
    const dx = (Math.random()-0.5)*60;
    const dy = (Math.random()-0.5)*60;
    ctx.strokeStyle = `rgb(${128+dx},${128+dy},255)`;
    ctx.lineWidth = w;
    ctx.beginPath();
    let y=0, cx=x;
    while(y<1024){
      const ny=y+5+Math.random()*10;
      const ox=cx+(Math.random()-0.5)*18;
      ctx.moveTo(cx,y); ctx.quadraticCurveTo(ox,(y+ny)/2,cx+(Math.random()-0.5)*10,ny);
      cx+=(Math.random()-0.5)*10; y=ny;
    }
    ctx.stroke();
  }
  // Tooth normals
  for (let i = 0; i < 20000; i++) {
    const x=Math.random()*4096, y=Math.random()*1024;
    const dx=(Math.random()-0.5)*40, dy=(Math.random()-0.5)*40;
    ctx.fillStyle = `rgb(${128+dx},${128+dy},255)`;
    ctx.beginPath(); ctx.arc(x,y,1+Math.random()*2,0,Math.PI*2); ctx.fill();
  }
  // Seam normal
  ctx.strokeStyle = 'rgb(100,100,255)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x=0; x<=4096; x+=2) {
    const y=512+Math.sin(x*0.008)*8+Math.sin(x*0.03)*3;
    if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();

  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping; t.anisotropy = 16;
  return t;
}

// ═══ ROUGHNESS MAP — varying surface gloss ══════════════════════
function createRoughnessMap() {
  const c = document.createElement('canvas');
  c.width = 4096; c.height = 1024;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#888'; ctx.fillRect(0,0,4096,1024);

  // Oil spots — smoother (glossier)
  for (let i = 0; i < 400; i++) {
    const x=Math.random()*4096, y=Math.random()*1024;
    const r=5+Math.random()*20;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'#555'); g.addColorStop(1,'rgba(136,136,136,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  // Rougher patches
  for (let i = 0; i < 600; i++) {
    const x=Math.random()*4096, y=Math.random()*1024;
    const r=3+Math.random()*12;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'#aa'); g.addColorStop(1,'rgba(170,170,170,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  // Vein roughness
  for (let i = 0; i < 80; i++) {
    const x = Math.random()*4096;
    ctx.strokeStyle = 'rgba(170,170,170,0.3)'; ctx.lineWidth = 2;
    ctx.beginPath();
    let y=0, cx=x;
    while(y<1024){ const ny=y+5+Math.random()*10; ctx.moveTo(cx,y); ctx.lineTo(cx+(Math.random()-0.5)*8,ny); cx+=(Math.random()-0.5)*8; y=ny; }
    ctx.stroke();
  }

  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping; t.anisotropy = 16;
  return t;
}

// ═══ BAND TEXTURE ════════════════════════════════════════════════
function createBandTexture() {
  const c = document.createElement('canvas');
  c.width = 2048; c.height = 512;
  const ctx = c.getContext('2d');

  const g = ctx.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#604006'); g.addColorStop(0.05,'#a07808');
  g.addColorStop(0.15,'#c9943a'); g.addColorStop(0.3,'#e8c560');
  g.addColorStop(0.42,'#f5dc7a'); g.addColorStop(0.5,'#fce588');
  g.addColorStop(0.58,'#f5dc7a'); g.addColorStop(0.7,'#e8c560');
  g.addColorStop(0.85,'#c9943a'); g.addColorStop(0.95,'#a07808');
  g.addColorStop(1,'#604006');
  ctx.fillStyle=g; ctx.fillRect(0,0,2048,512);

  // Brushed gold
  for (let i=0;i<8000;i++){
    const x=Math.random()*2048, y=Math.random()*512;
    ctx.fillStyle = Math.random()>0.5
      ? `rgba(255,235,150,${0.02+Math.random()*0.08})`
      : `rgba(80,50,3,${0.02+Math.random()*0.08})`;
    ctx.fillRect(x,y,1+Math.random()*5,1+Math.random()*2);
  }

  // Triple border
  ctx.strokeStyle='rgba(30,15,0,0.7)'; ctx.lineWidth=5;
  ctx.strokeRect(16,16,2016,480);
  ctx.lineWidth=2; ctx.strokeRect(30,30,1988,452);
  ctx.strokeStyle='rgba(30,15,0,0.35)'; ctx.lineWidth=1;
  ctx.strokeRect(42,42,1964,428);

  // VP
  ctx.fillStyle='#1a0e02'; ctx.font='bold 210px Georgia,serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(255,240,180,0.5)'; ctx.shadowBlur=15;
  ctx.shadowOffsetY=3; ctx.fillText('VP',1024,268);
  ctx.shadowBlur=0; ctx.shadowOffsetY=0;

  // Flourishes
  ctx.font='90px Georgia,serif'; ctx.fillText('◆',700,268); ctx.fillText('◆',1348,268);
  ctx.fillStyle='rgba(30,15,0,0.25)'; ctx.fillRect(0,0,2048,12); ctx.fillRect(0,500,2048,12);

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16;
  return t;
}

// Band normal map for embossed effect
function createBandNormal() {
  const c = document.createElement('canvas');
  c.width = 2048; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#8080ff'; ctx.fillRect(0,0,2048,512);
  // Border emboss
  ctx.strokeStyle = 'rgb(60,60,255)'; ctx.lineWidth = 6;
  ctx.strokeRect(16,16,2016,480); ctx.strokeRect(30,30,1988,452);
  // VP emboss
  ctx.fillStyle = 'rgb(180,180,255)'; ctx.font='bold 210px Georgia,serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('VP',1024,268);
  return new THREE.CanvasTexture(c);
}

// ═══ CIGAR GEOMETRY ══════════════════════════════════════════════
const L = 3.8, R = 0.34;
const cigarGeo = new THREE.CylinderGeometry(R, R, L, 192, 400, false);

const pos = cigarGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const y = pos.getY(i), x = pos.getX(i), z = pos.getZ(i);

  // Cap (mouth) — rounded dome with slight flatten
  if (y > L * 0.46) {
    const t = (y - L*0.46) / (L*0.04);
    const r = Math.sqrt(x*x + z*z);
    const a = Math.atan2(z, x);
    const nr = r * (1 - t * 0.55);
    pos.setX(i, Math.cos(a)*nr); pos.setZ(i, Math.sin(a)*nr);
    pos.setY(i, y + t * 0.14);
  }

  // Lit end — irregular burn + taper
  if (y < -L * 0.42) {
    const t = (-L*0.42 - y) / (L*0.08);
    const r = Math.sqrt(x*x + z*z);
    const a = Math.atan2(z, x);
    const noise = 1 + Math.sin(a*9)*0.04 + Math.cos(a*17)*0.025 + Math.sin(a*31)*0.015;
    const nr = r * (1 - t*0.18) * noise;
    pos.setX(i, Math.cos(a)*nr); pos.setZ(i, Math.sin(a)*nr);
  }
}
cigarGeo.computeVertexNormals();
cigarGeo.rotateZ(Math.PI/2);

// ═══ CIGAR MATERIAL — full PBR with physical material ════════════
const cigarMat = new THREE.MeshPhysicalMaterial({
  map: createWrapperTexture(),
  normalMap: createNormalMap(),
  normalScale: new THREE.Vector2(0.8, 0.8),
  roughnessMap: createRoughnessMap(),
  roughness: 1.0,
  metalness: 0.15,
  envMap: envMap,
  envMapIntensity: 0.6,
  clearcoat: 0.3,
  clearcoatRoughness: 0.8,
});

const cigar = new THREE.Mesh(cigarGeo, cigarMat);
scene.add(cigar);

// ═══ FILLER TOBACCO at the lit foot — visible leaves ═════════════
const fillerGroup = new THREE.Group();
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2;
  const r = R * 0.3 + Math.random() * R * 0.5;
  const len = 0.08 + Math.random() * 0.15;
  const fgeo = new THREE.CylinderGeometry(r*0.15, r*0.1, len, 8);
  fgeo.rotateZ(Math.PI/2);
  const fmat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.05+Math.random()*0.05, 0.5+Math.random()*0.3, 0.1+Math.random()*0.12),
    roughness: 0.9, metalness: 0.05, envMap: envMap, envMapIntensity: 0.3,
  });
  const fmesh = new THREE.Mesh(fgeo, fmat);
  fmesh.position.set(-L/2 - len/2 - 0.02 + Math.random()*0.04, Math.cos(a)*r*0.7, Math.sin(a)*r*0.7);
  fmesh.rotation.x = a + (Math.random()-0.5)*0.3;
  fmesh.rotation.y = (Math.random()-0.5)*0.4;
  fillerGroup.add(fmesh);
}
scene.add(fillerGroup);

// ═══ BAND ═══════════════════════════════════════════════════════
const bandGeo = new THREE.CylinderGeometry(R*1.16, R*1.16, 0.55, 192, 1, true);
bandGeo.rotateZ(Math.PI/2);
const bandMat = new THREE.MeshPhysicalMaterial({
  map: createBandTexture(),
  normalMap: createBandNormal(),
  normalScale: new THREE.Vector2(0.5, 0.5),
  roughness: 0.15, metalness: 0.95,
  envMap: envMap, envMapIntensity: 1.8,
  clearcoat: 0.5, clearcoatRoughness: 0.1,
  side: THREE.DoubleSide,
});
const band = new THREE.Mesh(bandGeo, bandMat);
band.position.x = 0.55;
scene.add(band);

// ═══ LIT FOOT — ember + ash ═════════════════════════════════════
// Burn face
const footGeo = new THREE.CircleGeometry(R*0.92, 96);
footGeo.rotateY(Math.PI/2);
const footMat = new THREE.MeshStandardMaterial({
  color: 0xff4400, emissive: 0xff6b35, emissiveIntensity: 5,
  roughness: 0.25, side: THREE.DoubleSide, envMap: envMap, envMapIntensity: 0.3,
});
const foot = new THREE.Mesh(footGeo, footMat);
foot.position.x = -L/2 - 0.005;
scene.add(foot);

// Bright ember core
const emberGeo = new THREE.CircleGeometry(R*0.6, 64);
emberGeo.rotateY(Math.PI/2);
const emberMat = new THREE.MeshBasicMaterial({
  color: 0xffdd00, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
});
const ember = new THREE.Mesh(emberGeo, emberMat);
ember.position.x = -L/2 + 0.01;
scene.add(ember);

// Charred ash ring + ash column
const ashGeo = new THREE.TorusGeometry(R*0.94, 0.06, 32, 96);
ashGeo.rotateY(Math.PI/2);
const ashMat = new THREE.MeshStandardMaterial({
  color: 0xc0bda8, roughness: 0.98, metalness: 0.02,
  envMap: envMap, envMapIntensity: 0.15,
});
const ash = new THREE.Mesh(ashGeo, ashMat);
ash.position.x = -L/2 - 0.02;
scene.add(ash);

// Ash column — grey buildup
const ashColGeo = new THREE.CylinderGeometry(R*0.85, R*0.5, 0.15, 32, 3);
ashColGeo.rotateZ(Math.PI/2);
const ashCol = new THREE.Mesh(ashColGeo, new THREE.MeshStandardMaterial({
  color: 0xb5b3a0, roughness: 1.0, metalness: 0.0, envMap: envMap, envMapIntensity: 0.1,
}));
ashCol.position.x = -L/2 - 0.08;
scene.add(ashCol);

// ═══ SMOKE — sprite-based for realism ═════════════════════════════
function createSmokeTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(230,230,230,0.5)');
  g.addColorStop(0.2,'rgba(210,210,210,0.3)');
  g.addColorStop(0.5,'rgba(190,190,190,0.1)');
  g.addColorStop(1,'rgba(170,170,170,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  for (let i=0;i<500;i++){
    const x=Math.random()*128, y=Math.random()*128;
    const r=1+Math.random()*12, d=Math.sqrt((x-64)**2+(y-64)**2);
    if(d<58){
      const v=170+Math.random()*60;
      ctx.fillStyle=`rgba(${v},${v},${v},${0.01+Math.random()*0.06})`;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
  }
  return new THREE.CanvasTexture(c);
}
const smokeTex = createSmokeTexture();

const smokeCount = 200;
const smokeGeo = new THREE.BufferGeometry();
const smokePos = new Float32Array(smokeCount*3);
const smokeData = [];
for (let i=0; i<smokeCount; i++) {
  smokeData.push({
    x:-L/2-0.1-Math.random()*1.2,
    y:(Math.random()-0.5)*0.1, z:(Math.random()-0.5)*0.1,
    vx:-0.002-Math.random()*0.005, vy:0.004+Math.random()*0.009,
    vz:(Math.random()-0.5)*0.003, life:Math.random()*5,
    maxLife:2.5+Math.random()*2.5, size:0.08+Math.random()*0.12,
  });
  smokePos[i*3]=smokeData[i].x; smokePos[i*3+1]=smokeData[i].y; smokePos[i*3+2]=smokeData[i].z;
}
smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));

const smokeMat = new THREE.PointsMaterial({
  map: smokeTex, size: 0.45, transparent: true, opacity: 0.3,
  depthWrite: false, blending: THREE.NormalBlending, sizeAttenuation: true,
});
const smoke = new THREE.Points(smokeGeo, smokeMat);
scene.add(smoke);

// ═══ GLOW ═══════════════════════════════════════════════════════
function createGlowTex() {
  const c=document.createElement('canvas'); c.width=256; c.height=256;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(255,100,40,0.3)');
  g.addColorStop(0.15,'rgba(255,70,20,0.18)');
  g.addColorStop(0.4,'rgba(255,50,0,0.06)');
  g.addColorStop(1,'rgba(255,40,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: createGlowTex(), transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
glow.scale.set(3,3,1); glow.position.set(-L/2-0.25,0,0);
scene.add(glow);

// ═══ CONTACT SHADOW — fake AO blob under cigar ══════════════════
function createShadowTex() {
  const c=document.createElement('canvas'); c.width=256; c.height=256;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(0,0,0,0.4)');
  g.addColorStop(0.5,'rgba(0,0,0,0.15)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 2),
  new THREE.MeshBasicMaterial({ map: createShadowTex(), transparent: true, depthWrite: false })
);
shadow.rotation.x = -Math.PI/2;
shadow.position.y = -R - 0.3;
scene.add(shadow);

// ═══ GROUP ══════════════════════════════════════════════════════
const group = new THREE.Group();
group.add(cigar); group.add(fillerGroup); group.add(band);
group.add(foot); group.add(ember); group.add(ash); group.add(ashCol);
group.add(glow); group.add(shadow);
scene.remove(cigar, fillerGroup, band, foot, ember, ash, ashCol, glow, shadow);
scene.add(group);

// ═══ INTERACTION ════════════════════════════════════════════════
let tRotY=0, tRotX=0.1, rotY=0, rotX=0;
let drag=false, lx=0, ly=0;
renderer.domElement.style.cursor='grab';
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.style.cursor='grabbing'});
addEventListener('pointerup',()=>{drag=false;renderer.domElement.style.cursor='grab'});
addEventListener('pointermove',e=>{
  if(!drag){tRotY=(e.clientX/innerWidth-0.5)*0.4;tRotX=0.1+(e.clientY/innerHeight-0.5)*0.2;return;}
  tRotY+=(e.clientX-lx)*0.008; tRotX+=(e.clientY-ly)*0.008;
  tRotX=Math.max(-0.9,Math.min(0.9,tRotX)); lx=e.clientX; ly=e.clientY;
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// ═══ ANIMATE ═══════════════════════════════════════════════════
let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=0.016;
  if(!drag) tRotY+=0.002;
  rotY+=(tRotY-rotY)*0.06; rotX+=(tRotX-rotX)*0.06;
  group.rotation.y=rotY; group.rotation.x=rotX;
  group.position.y=Math.sin(t*0.6)*0.035;

  const p=Math.sin(t*2.2);
  footMat.emissiveIntensity=4+p*1.5;
  emberMat.opacity=0.75+p*0.2;
  emberLight.intensity=4.5+p*2;
  glow.material.opacity=0.7+p*0.2;

  const positions=smokeGeo.attributes.position.array;
  const cy=Math.cos(rotY), sy=Math.sin(rotY);
  const cx=Math.cos(rotX), sx=Math.sin(rotX);
  for(let i=0;i<smokeCount;i++){
    const d=smokeData[i]; d.life+=0.016;
    if(d.life>d.maxLife){
      d.life=0; d.x=-L/2-0.02+(Math.random()-0.5)*0.04;
      d.y=(Math.random()-0.5)*0.04; d.z=(Math.random()-0.5)*0.04;
      d.vx=-0.002-Math.random()*0.005; d.vy=0.004+Math.random()*0.009; d.vz=(Math.random()-0.5)*0.003;
    }
    d.x+=d.vx; d.y+=d.vy; d.z+=d.vz;
    d.vy*=0.99; d.vx*=0.98; d.vz*=0.99;
    d.vx+=(Math.random()-0.5)*0.0005; d.vz+=(Math.random()-0.5)*0.0005;
    const rx=d.x*cy+d.z*sy, rz=-d.x*sy+d.z*cy;
    const ry=d.y*cx-rz*sx, fz=d.y*sx+rz*cx;
    positions[i*3]=rx; positions[i*3+1]=ry+Math.sin(t*0.3+i*0.2)*0.003; positions[i*3+2]=fz;
  }
  smokeGeo.attributes.position.needsUpdate=true;
  renderer.render(scene,camera);
}
animate();
</script>
