<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitola Pedia — Premium Cigar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: Georgia, serif; }

  #cigar-stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 800px;
  }

  /* ── CIGAR BODY ── */
  .cigar-wrap {
    position: relative;
    width: 280px;
    height: 60px;
    transform-style: preserve-3d;
    animation: cigar-float 6s ease-in-out infinite;
    cursor: grab;
  }

  @keyframes cigar-float {
    0%, 100% { transform: rotateX(8deg) rotateY(-12deg) translateY(0); }
    50% { transform: rotateX(8deg) rotateY(12deg) translateY(-12px); }
  }

  .cigar-body {
    position: absolute;
    width: 280px;
    height: 52px;
    border-radius: 26px / 26px;
    background: linear-gradient(
      to bottom,
      #3a1f0f 0%,
      #4a2a14 8%,
      #5c3520 20%,
      #6b3e26 35%,
      #7a4628 50%,
      #6b3e26 65%,
      #5c3520 80%,
      #4a2a14 92%,
      #3a1f0f 100%
    );
    box-shadow:
      inset 0 2px 4px rgba(255,180,100,0.15),
      inset 0 -2px 6px rgba(0,0,0,0.5),
      0 8px 30px rgba(0,0,0,0.6),
      0 2px 8px rgba(201,148,58,0.2);
    overflow: hidden;
  }

  /* Wrapper leaf texture — subtle vertical veins */
  .cigar-body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 12px,
      rgba(0,0,0,0.04) 12px,
      rgba(0,0,0,0.04) 13px
    );
    border-radius: inherit;
  }

  /* Sheen */
  .cigar-body::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 8%;
    right: 8%;
    height: 14px;
    background: linear-gradient(to bottom, rgba(255,200,140,0.25), transparent);
    border-radius: 50%;
    filter: blur(3px);
  }

  /* ── CIGAR BAND (gold) ── */
  .cigar-band {
    position: absolute;
    left: 42%;
    top: -2px;
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #c9943a 0%, #e8c560 30%, #f0d674 50%, #e8c560 70%, #c9943a 100%);
    border-radius: 4px / 26px;
    box-shadow:
      0 0 2px rgba(0,0,0,0.4),
      inset 0 1px 2px rgba(255,255,255,0.3),
      inset 0 -1px 2px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .cigar-band::before {
    content: 'VP';
    font-family: Georgia, serif;
    font-size: 16px;
    font-weight: bold;
    color: #1a1209;
    letter-spacing: 1px;
    text-shadow: 0 1px 0 rgba(255,235,180,0.3);
  }

  .cigar-band::after {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px solid rgba(26,18,9,0.3);
    border-radius: 3px / 23px;
  }

  /* ── CAP (mouth end) ── */
  .cigar-cap {
    position: absolute;
    right: -2px;
    top: 0;
    width: 24px;
    height: 52px;
    background: linear-gradient(
      to right,
      transparent 0%,
      rgba(0,0,0,0.15) 60%,
      rgba(0,0,0,0.3) 100%
    );
    border-radius: 0 26px 26px 0;
  }

  /* ── FOOT (lit end) ── */
  .cigar-foot {
    position: absolute;
    left: -3px;
    top: 0;
    width: 18px;
    height: 52px;
    background: radial-gradient(
      ellipse at 0% 50%,
      #ff6b35 0%,
      #ff4500 20%,
      #cc3300 40%,
      #661a00 70%,
      transparent 100%
    );
    border-radius: 26px 0 0 26px;
    box-shadow:
      -4px 0 20px rgba(255,107,53,0.6),
      -2px 0 8px rgba(255,69,0,0.4);
  }

  /* Ember glow pulse */
  .cigar-foot::before {
    content: '';
    position: absolute;
    left: 2px;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 8px;
    background: radial-gradient(circle, #ffaa00, #ff6b35);
    border-radius: 50%;
    filter: blur(2px);
    animation: ember-pulse 2s ease-in-out infinite;
  }

  @keyframes ember-pulse {
    0%, 100% { opacity: 0.8; transform: translateY(-50%) scale(1); }
    50% { opacity: 1; transform: translateY(-50%) scale(1.3); }
  }

  /* ── SMOKE PARTICLES ── */
  .smoke {
    position: absolute;
    left: -10px;
    top: 50%;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .smoke-particle {
    position: absolute;
    left: 0;
    top: 50%;
    width: 20px;
    height: 20px;
    background: radial-gradient(circle, rgba(200,200,200,0.15), transparent 70%);
    border-radius: 50%;
    animation: smoke-rise 4s ease-out infinite;
  }

  .smoke-particle:nth-child(1) { animation-delay: 0s; animation-duration: 3.5s; }
  .smoke-particle:nth-child(2) { animation-delay: 0.8s; animation-duration: 4.2s; }
  .smoke-particle:nth-child(3) { animation-delay: 1.5s; animation-duration: 3.8s; }
  .smoke-particle:nth-child(4) { animation-delay: 2.2s; animation-duration: 4.5s; }
  .smoke-particle:nth-child(5) { animation-delay: 3s; animation-duration: 3.2s; }
  .smoke-particle:nth-child(6) { animation-delay: 1.1s; animation-duration: 4s; }

  @keyframes smoke-rise {
    0% {
      transform: translate(0, 0) scale(0.3);
      opacity: 0;
    }
    15% {
      opacity: 0.5;
    }
    100% {
      transform: translate(-80px, -120px) scale(2.5);
      opacity: 0;
    }
  }

  /* ── ASH (falling from foot) ── */
  .ash {
    position: absolute;
    left: -15px;
    top: 55%;
    width: 4px;
    height: 4px;
    background: #9a9a8a;
    border-radius: 50%;
    opacity: 0;
    animation: ash-fall 5s ease-in infinite;
  }

  @keyframes ash-fall {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 0.8; }
    100% { transform: translate(-30px, 60px); opacity: 0; }
  }

  /* ── AMBIENT GLOW ── */
  .glow {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-200%, -50%);
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(255,107,53,0.08), transparent 60%);
    border-radius: 50%;
    pointer-events: none;
    animation: glow-pulse 3s ease-in-out infinite;
  }

  @keyframes glow-pulse {
    0%, 100% { transform: translate(-200%, -50%) scale(1); opacity: 0.5; }
    50% { transform: translate(-200%, -50%) scale(1.2); opacity: 0.8; }
  }
</style>
</head>
<body>
<div id="cigar-stage">
  <div class="glow"></div>
  <div class="cigar-wrap" id="cigar">
    <div class="cigar-foot"></div>
    <div class="cigar-body">
      <div class="cigar-band"></div>
    </div>
    <div class="cigar-cap"></div>
    <div class="smoke">
      <div class="smoke-particle"></div>
      <div class="smoke-particle"></div>
      <div class="smoke-particle"></div>
      <div class="smoke-particle"></div>
      <div class="smoke-particle"></div>
      <div class="smoke-particle"></div>
    </div>
    <div class="ash"></div>
  </div>
</div>
<script>
  // Subtle mouse parallax
  const cigar = document.getElementById('cigar');
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 8;
    const y = (e.clientY / window.innerHeight - 0.5) * 6;
    cigar.style.transform = `rotateX(${8 + y}deg) rotateY(${-12 + x}deg) translateY(${Math.sin(Date.now() / 1000) * 8}px)`;
  });
</script>
</body>
</html>
