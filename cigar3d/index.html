<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitola Pedia — 3D Cigar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ── SCENE ──
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ── STUDIO LIGHTING ──
// Key light (warm, from upper right)
const keyLight = new THREE.DirectionalLight(0xfff0e0, 2.5);
keyLight.position.set(4, 5, 3);
scene.add(keyLight);

// Fill light (cool, from lower left)
const fillLight = new THREE.DirectionalLight(0xb0c4de, 0.8);
fillLight.position.set(-3, -1, 2);
scene.add(fillLight);

// Rim light (behind, warm gold)
const rimLight = new THREE.DirectionalLight(0xffaa55, 1.2);
rimLight.position.set(0, 2, -4);
scene.add(rimLight);

// Ambient
const ambient = new THREE.AmbientLight(0x2a1a0a, 0.4);
scene.add(ambient);

// Ember point light (from the lit end)
const emberLight = new THREE.PointLight(0xff6b35, 2, 3, 1.5);
emberLight.position.set(-2, 0, 0);
scene.add(emberLight);

// ── WRAPPER TEXTURE (canvas-generated) ──
function createWrapperTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d');

  // Base gradient — dark brown wrapper leaf
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#3a1f0f');
  grad.addColorStop(0.15, '#4a2a14');
  grad.addColorStop(0.35, '#5c3520');
  grad.addColorStop(0.5, '#6b3e26');
  grad.addColorStop(0.65, '#5c3520');
  grad.addColorStop(0.85, '#4a2a14');
  grad.addColorStop(1, '#3a1f0f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 256);

  // Wrapper veins — subtle vertical streaks
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * 1024;
    const w = 1 + Math.random() * 2;
    const opacity = 0.03 + Math.random() * 0.06;
    const dark = Math.random() > 0.5;
    ctx.strokeStyle = dark
      ? `rgba(0,0,0,${opacity})`
      : `rgba(180,120,60,${opacity})`;
    ctx.lineWidth = w;
    ctx.beginPath();
    // Wavy vein
    let y = 0;
    while (y < 256) {
      const ny = y + 10 + Math.random() * 20;
      const ox = x + (Math.random() - 0.5) * 8;
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(ox, (y + ny) / 2, x + (Math.random() - 0.5) * 4, ny);
      y = ny;
    }
    ctx.stroke();
  }

  // Tooth/speckle texture
  for (let i = 0; i < 3000; i++) {
    const x = Math.random() * 1024;
    const y = Math.random() * 256;
    const r = Math.random() * 1.5;
    const dark = Math.random() > 0.4;
    ctx.fillStyle = dark
      ? `rgba(0,0,0,${0.02 + Math.random() * 0.08})`
      : `rgba(200,150,80,${0.02 + Math.random() * 0.05})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Sheen highlight band
  const sheen = ctx.createLinearGradient(0, 40, 0, 90);
  sheen.addColorStop(0, 'rgba(255,200,140,0)');
  sheen.addColorStop(0.5, 'rgba(255,200,140,0.08)');
  sheen.addColorStop(1, 'rgba(255,200,140,0)');
  ctx.fillStyle = sheen;
  ctx.fillRect(0, 40, 1024, 50);

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ── BAND TEXTURE (gold with VP logo) ──
function createBandTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');

  // Gold gradient
  const grad = ctx.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0, '#b8860b');
  grad.addColorStop(0.15, '#c9943a');
  grad.addColorStop(0.4, '#e8c560');
  grad.addColorStop(0.5, '#f0d674');
  grad.addColorStop(0.6, '#e8c560');
  grad.addColorStop(0.85, '#c9943a');
  grad.addColorStop(1, '#b8860b');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 128);

  // Decorative border lines
  ctx.strokeStyle = 'rgba(60,35,10,0.4)';
  ctx.lineWidth = 2;
  ctx.strokeRect(8, 8, 496, 112);
  ctx.lineWidth = 1;
  ctx.strokeRect(14, 14, 484, 100);

  // VP monogram
  ctx.fillStyle = '#1a1209';
  ctx.font = 'bold 56px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('VP', 256, 66);

  // Decorative flourishes
  ctx.font = '20px Georgia, serif';
  ctx.fillText('•', 180, 66);
  ctx.fillText('•', 332, 66);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ── CIGAR GEOMETRY ──
const cigarLength = 3.2;
const cigarRadius = 0.28;
const segments = 128;
const radialSegs = 64;

// Custom geometry — cylinder with rounded cap end and flat lit end
const cigarGeo = new THREE.CylinderGeometry(
  cigarRadius, cigarRadius, cigarLength, radialSegs, segments, false
);

// Round the cap (mouth) end — push vertices at the top toward a dome
const pos = cigarGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const y = pos.getY(i);
  // Top cap rounding
  if (y > cigarLength * 0.48) {
    const distFromTop = (y - cigarLength * 0.48) / (cigarLength * 0.02);
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const angle = Math.atan2(z, x);
    const r = Math.sqrt(x * x + z * z) * (1 - distFromTop * 0.5);
    pos.setX(i, Math.cos(angle) * r);
    pos.setZ(i, Math.sin(angle) * r);
  }
  // Slight taper at the lit (bottom) end
  if (y < -cigarLength * 0.45) {
    const distFromBottom = (-cigarLength * 0.45 - y) / (cigarLength * 0.05);
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const angle = Math.atan2(z, x);
    const r = Math.sqrt(x * x + z * z) * (1 - distFromBottom * 0.15);
    pos.setX(i, Math.cos(angle) * r);
    pos.setZ(i, Math.sin(angle) * r);
  }
}
cigarGeo.computeVertexNormals();

// Rotate so length is horizontal
cigarGeo.rotateZ(Math.PI / 2);

// ── CIGAR MATERIAL ──
const wrapperTex = createWrapperTexture();
wrapperTex.repeat.set(1, 1);

const cigarMat = new THREE.MeshStandardMaterial({
  map: wrapperTex,
  roughness: 0.75,
  metalness: 0.05,
  color: 0x6b3e26,
});

const cigar = new THREE.Mesh(cigarGeo, cigarMat);
cigar.position.y = 0;
scene.add(cigar);

// ── CIGAR BAND ──
const bandGeo = new THREE.CylinderGeometry(
  cigarRadius * 1.08, cigarRadius * 1.08, 0.35, radialSegs, 1, true
);
bandGeo.rotateZ(Math.PI / 2);

const bandTex = createBandTexture();
const bandMat = new THREE.MeshStandardMaterial({
  map: bandTex,
  roughness: 0.3,
  metalness: 0.7,
  side: THREE.DoubleSide,
});

const band = new THREE.Mesh(bandGeo, bandMat);
band.position.x = 0.3; // offset toward cap
scene.add(band);

// ── LIT FOOT (ember) ──
const footGeo = new THREE.CircleGeometry(cigarRadius * 0.85, 32);
footGeo.rotateY(Math.PI / 2);

const footMat = new THREE.MeshStandardMaterial({
  color: 0xff4500,
  emissive: 0xff6b35,
  emissiveIntensity: 2.5,
  roughness: 0.4,
  side: THREE.DoubleSide,
});

const foot = new THREE.Mesh(footGeo, footMat);
foot.position.x = -cigarLength / 2 - 0.01;
scene.add(foot);

// Ash ring on the lit end
const ashGeo = new THREE.TorusGeometry(cigarRadius * 0.9, 0.03, 16, 32);
ashGeo.rotateY(Math.PI / 2);
const ashMat = new THREE.MeshStandardMaterial({
  color: 0x9a9a8a,
  roughness: 0.9,
  metalness: 0.0,
});
const ash = new THREE.Mesh(ashGeo, ashMat);
ash.position.x = -cigarLength / 2 - 0.02;
scene.add(ash);

// ── SMOKE PARTICLES ──
const smokeCount = 80;
const smokeGeo = new THREE.BufferGeometry();
const smokePositions = new Float32Array(smokeCount * 3);
const smokeData = [];

for (let i = 0; i < smokeCount; i++) {
  const x = -cigarLength / 2 - 0.1 - Math.random() * 0.5;
  const y = (Math.random() - 0.5) * 0.2;
  const z = (Math.random() - 0.5) * 0.2;
  smokePositions[i * 3] = x;
  smokePositions[i * 3 + 1] = y;
  smokePositions[i * 3 + 2] = z;
  smokeData.push({
    x, y, z,
    vx: -0.005 - Math.random() * 0.01,
    vy: 0.008 + Math.random() * 0.015,
    vz: (Math.random() - 0.5) * 0.005,
    life: Math.random(),
    maxLife: 1 + Math.random() * 1.5,
    size: 0.05 + Math.random() * 0.15,
  });
}

smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePositions, 3));

// Smoke texture
function createSmokeTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(200,200,200,0.4)');
  grad.addColorStop(0.4, 'rgba(180,180,180,0.15)');
  grad.addColorStop(1, 'rgba(160,160,160,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

const smokeMat = new THREE.PointsMaterial({
  map: createSmokeTexture(),
  size: 0.3,
  transparent: true,
  opacity: 0.5,
  depthWrite: false,
  blending: THREE.NormalBlending,
});

const smoke = new THREE.Points(smokeGeo, smokeMat);
scene.add(smoke);

// ── GLOW SPRITE (around ember) ──
function createGlowTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,107,53,0.5)');
  grad.addColorStop(0.3, 'rgba(255,69,0,0.2)');
  grad.addColorStop(1, 'rgba(255,69,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

const glowMat = new THREE.SpriteMaterial({
  map: createGlowTexture(),
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const glow = new THREE.Sprite(glowMat);
glow.scale.set(1.5, 1.5, 1);
glow.position.set(-cigarLength / 2 - 0.1, 0, 0);
scene.add(glow);

// ── ROTATION & INTERACTION ──
let rotationY = 0;
let rotationX = 0;
let targetRotY = 0;
let targetRotX = 0.15;
let isDragging = false;
let lastX = 0, lastY = 0;

const group = new THREE.Group();
group.add(cigar);
group.add(band);
group.add(foot);
group.add(ash);
group.add(glow);
scene.remove(cigar, band, foot, ash, glow);
scene.add(group);

// Mouse drag
renderer.domElement.addEventListener('mousedown', (e) => {
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', (e) => {
  if (!isDragging) {
    // Subtle parallax when not dragging
    const nx = (e.clientX / window.innerWidth - 0.5);
    const ny = (e.clientY / window.innerHeight - 0.5);
    targetRotY = nx * 0.3;
    targetRotX = 0.15 + ny * 0.2;
    return;
  }
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  targetRotY += dx * 0.01;
  targetRotX += dy * 0.01;
  targetRotX = Math.max(-0.8, Math.min(0.8, targetRotX));
  lastX = e.clientX;
  lastY = e.clientY;
});

// Touch
renderer.domElement.addEventListener('touchstart', (e) => {
  isDragging = true;
  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;
});
window.addEventListener('touchend', () => { isDragging = false; });
window.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  e.preventDefault();
  const dx = e.touches[0].clientX - lastX;
  const dy = e.touches[0].clientY - lastY;
  targetRotY += dx * 0.01;
  targetRotX += dy * 0.01;
  targetRotX = Math.max(-0.8, Math.min(0.8, targetRotX));
  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;
}, { passive: false });

// ── RESIZE ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── ANIMATE ──
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.016;

  // Auto-rotate when not dragging
  if (!isDragging) {
    targetRotY += 0.004;
  }

  // Smooth rotation
  rotationY += (targetRotY - rotationY) * 0.08;
  rotationX += (targetRotX - rotationX) * 0.08;
  group.rotation.y = rotationY;
  group.rotation.x = rotationX;

  // Gentle bob
  group.position.y = Math.sin(time * 0.8) * 0.04;

  // Ember pulse
  footMat.emissiveIntensity = 2 + Math.sin(time * 3) * 0.5;
  emberLight.intensity = 1.5 + Math.sin(time * 3) * 0.5;
  glowMat.opacity = 0.7 + Math.sin(time * 3) * 0.2;

  // Update smoke particles
  const positions = smokeGeo.attributes.position.array;
  for (let i = 0; i < smokeCount; i++) {
    const d = smokeData[i];
    d.life += 0.016;
    if (d.life > d.maxLife) {
      d.life = 0;
      d.x = -cigarLength / 2 - 0.1 + (Math.random() - 0.5) * 0.1;
      d.y = (Math.random() - 0.5) * 0.1;
      d.z = (Math.random() - 0.5) * 0.1;
      d.vx = -0.005 - Math.random() * 0.01;
      d.vy = 0.008 + Math.random() * 0.015;
      d.vz = (Math.random() - 0.5) * 0.005;
    }
    d.x += d.vx;
    d.y += d.vy;
    d.z += d.vz;
    d.vy *= 0.99; // slow down
    d.vx *= 0.98;
    // Apply group rotation to particle positions
    const cosY = Math.cos(rotationY);
    const sinY = Math.sin(rotationY);
    const rx = d.x * cosY + d.z * sinY;
    const rz = -d.x * sinY + d.z * cosY;
    positions[i * 3] = rx;
    positions[i * 3 + 1] = d.y + Math.sin(time + i) * 0.01;
    positions[i * 3 + 2] = rz;
  }
  smokeGeo.attributes.position.needsUpdate = true;

  // Smoke size grows over life
  const lifeRatio = smokeData.map(d => d.life / d.maxLife);
  smokeMat.size = 0.3 + Math.sin(time * 0.5) * 0.02;

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
